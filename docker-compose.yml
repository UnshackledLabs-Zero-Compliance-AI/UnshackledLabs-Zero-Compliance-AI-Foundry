version: '3.8'
services:
  inference:
    build: ./inference
    ports:
      - "8000:8000"
    environment:
      - RELAY_URL=http://relay:8080
    depends_on:
      - relay

  relay:
    build: ./relay
    ports:
      - "8080:8080"

  exporter:
    build: ./exporter
    ports:
      - "9090:9090"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus